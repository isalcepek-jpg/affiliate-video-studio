name: Build Affiliate Video Studio APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract V2
        run: |
          set -e

          echo "===== ZIP FILE ====="
          ls -lh *.zip

          unzip -q AffiliateVideoStudio-screenshot-language-v2.zip

          echo "===== EXTRACTED FILES ====="
          find . -maxdepth 5 -type f | sort | head -300

            - name: Find web app
        run: |
          set -e

          echo "===== SEMUA FILE SETELAH ZIP DIEKSTRAK ====="
          find . -type f -not -path "./.git/*" | sort

          echo "===== MENCARI INDEX.HTML ====="
          find . -type f -iname "index.html" -not -path "./.git/*" -print

          echo "===== MENCARI FILE ZIP ====="
          find . -type f -iname "*.zip" -not -path "./.git/*" -print

          INDEX=$(find . -type f -iname "index.html" -not -path "./.git/*" -print -quit)

          if [ -z "$INDEX" ]; then
            echo "ERROR: index.html memang tidak ditemukan di hasil ekstraksi."
            exit 1
          fi

          WEB_DIR=$(dirname "$INDEX")

          echo "index.html ditemukan: $INDEX"
          echo "WEB_DIR=$WEB_DIR" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Capacitor project
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

          cat > capacitor.config.json <<EOF
          {
            "appId": "com.isalcepek.affiliatevideostudio",
            "appName": "Affiliate Video Studio",
            "webDir": "${WEB_DIR}"
          }
          EOF

          echo "===== CAPACITOR CONFIG ====="
          cat capacitor.config.json

      - name: Add Android platform
        run: |
          npx cap add android

      - name: Sync web app
        run: |
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AffiliateVideoStudio-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
