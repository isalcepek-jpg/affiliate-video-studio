name: Build Affiliate Video Studio APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Capacitor project
        run: |
          set -e

          npm init -y

          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 typescript
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.isalcepek.affiliatevideostudio',
            appName: 'Affiliate Video Studio',
            webDir: 'AffiliateVideoStudio'
          };

          export default config;
          EOF

      - name: Add Android platform
        run: |
          npx cap add android

      - name: Sync web app to Android
        run: |
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AffiliateVideoStudio-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
