name: Build Affiliate Video Studio APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check web app
        run: |
          pwd
          ls -la
          test -f AffiliateVideoStudio/index.html

      - name: Create Capacitor project
        run: |
          npm init -y

          npm install \
            @capacitor/core@7 \
            @capacitor/cli@7 \
            @capacitor/android@7

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.isalcepek.affiliatevideostudio",
            "appName": "Affiliate Video Studio",
            "webDir": "AffiliateVideoStudio",
            "plugins": {
              "CapacitorHttp": {
                "enabled": true
              }
            }
          }
          EOF

          echo "===== CAPACITOR CONFIG ====="
          cat capacitor.config.json

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web app
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AffiliateVideoStudio-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
