name: Build ISAL NOVA APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build ISAL NOVA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        shell: bash
        run: |
          set -e

          rm -rf www
          mkdir -p www

          cp index.html www/index.html

          LOGO=$(find . -type f \
            \( -iname "isal-nova-logo.png" \
            -o -iname "*isal*nova*.png" \
            -o -iname "*logo*.png" \) \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$LOGO" ]; then
            echo "ERROR: Logo ISAL NOVA tidak ditemukan."
            exit 1
          fi

          echo "Logo ditemukan: $LOGO"
          cp "$LOGO" www/isal-nova-logo.png

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure ISAL NOVA
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          strings = Path(
              "android/app/src/main/res/values/strings.xml"
          )

          if strings.exists():
              text = strings.read_text()

              text = re.sub(
                  r'<string name="app_name">.*?</string>',
                  '<string name="app_name">ISAL NOVA</string>',
                  text
              )

              strings.write_text(text)
          PY

      - name: Create launcher icons
        shell: bash
        run: |
          set -e

          for dir in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/mipmap-$dir"

            cp www/isal-nova-logo.png \
              "android/app/src/main/res/mipmap-$dir/ic_launcher.png"
          done

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cp \
            android/app/build/outputs/apk/debug/app-debug.apk \
            ISAL-NOVA.apk

      - name: Upload ISAL NOVA APK
        uses: actions/upload-artifact@v4
        with:
          name: ISAL-NOVA-apk
          path: ISAL-NOVA.apk
          retention-days: 7
