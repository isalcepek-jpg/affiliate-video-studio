name: Build ISAL NOVA APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build ISAL NOVA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        shell: bash
        run: |
          set -e

          rm -rf www
          mkdir -p www

          cp index.html www/index.html

          if [ ! -f "isal-nova-logo-1.png" ]; then
            echo "ERROR: isal-nova-logo-1.png tidak ditemukan di root repository."
            exit 1
          fi

          cp isal-nova-logo-1.png www/isal-nova-logo.png

          echo "Logo ISAL NOVA baru ditemukan."
          ls -lh www/isal-nova-logo.png

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure ISAL NOVA
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          strings = Path("android/app/src/main/res/values/strings.xml")

          if strings.exists():
              text = strings.read_text()

              text = re.sub(
                  r'<string name="app_name">.*?</string>',
                  '<string name="app_name">ISAL NOVA</string>',
                  text
              )

              strings.write_text(text)
          PY

      - name: Replace launcher icon
        shell: bash
        run: |
          set -e

          LOGO="www/isal-nova-logo.png"

          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          rm -rf android/app/src/main/res/mipmap-anydpi

          find android/app/src/main/res \
            -type f \
            -name "ic_launcher.xml" \
            -delete

          find android/app/src/main/res \
            -type f \
            -name "ic_launcher_round.xml" \
            -delete

          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

          cp "$LOGO" android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp "$LOGO" android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp "$LOGO" android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp "$LOGO" android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp "$LOGO" android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          echo "Logo baru berhasil dipasang."

      - name: Force Android icon
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")

          text = manifest.read_text()

          text = re.sub(
              r'android:icon="[^"]+"',
              'android:icon="@mipmap/ic_launcher"',
              text
          )

          text = re.sub(
              r'android:roundIcon="[^"]+"',
              'android:roundIcon="@mipmap/ic_launcher"',
              text
          )

          manifest.write_text(text)
          PY

      - name: Build ISAL NOVA APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ISAL-NOVA.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ISAL-NOVA-apk
          path: ISAL-NOVA.apk
          retention-days: 7
