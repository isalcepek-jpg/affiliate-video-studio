name: Build ISAL NOVA APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build ISAL NOVA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        shell: bash
        run: |
          set -e

          rm -rf www
          mkdir -p www

          cp index.html www/index.html

          LOGO=$(find . -type f \
            -iname "isal-nova-logo.png" \
            -o -iname "*isal*nova*.png" \
            -o -iname "*logo*.png" \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$LOGO" ]; then
            echo "ERROR: Logo ISAL NOVA tidak ditemukan."
            exit 1
          fi

          echo "Logo ditemukan: $LOGO"

          cp "$LOGO" www/isal-nova-logo.png

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure ISAL NOVA
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          strings = Path(
              "android/app/src/main/res/values/strings.xml"
          )

          if strings.exists():
              text = strings.read_text()

              text = re.sub(
                  r'<string name="app_name">.*?</string>',
                  '<string name="app_name">ISAL NOVA</string>',
                  text
              )

              strings.write_text(text)
          PY

      - name: Replace Android launcher icon
        shell: bash
        run: |
          set -e

          LOGO="www/isal-nova-logo.png"

          echo "Menggunakan logo: $LOGO"

          # Hapus adaptive icon bawaan Capacitor
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          rm -rf android/app/src/main/res/mipmap-anydpi

          # Hapus icon XML bawaan
          find android/app/src/main/res \
            -type f \
            -name "ic_launcher.xml" \
            -o -name "ic_launcher_round.xml" \
            -delete

          # Siapkan folder launcher
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

          # Gunakan logo ISAL NOVA
          cp "$LOGO" \
            android/app/src/main/res/mipmap-mdpi/ic_launcher.png

          cp "$LOGO" \
            android/app/src/main/res/mipmap-hdpi/ic_launcher.png

          cp "$LOGO" \
            android/app/src/main/res/mipmap-xhdpi/ic_launcher.png

          cp "$LOGO" \
            android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png

          cp "$LOGO" \
            android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          echo "Logo launcher ISAL NOVA berhasil dipasang."

      - name: Force AndroidManifest icon
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path
