name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q AffiliateVideoStudio-v1.zip

          echo "===== ISI HASIL ZIP ====="
          find . -maxdepth 5 -type f | sort | head -200

          echo "===== MENCARI PROJECT ANDROID ====="

          PROJECT_DIR=""

          if find . -type f -name "gradlew" | grep -q .; then
            PROJECT_DIR=$(find . -type f -name "gradlew" -print -quit | xargs dirname)
          elif find . -type f -name "settings.gradle" | grep -q .; then
            PROJECT_DIR=$(find . -type f -name "settings.gradle" -print -quit | xargs dirname)
          elif find . -type f -name "settings.gradle.kts" | grep -q .; then
            PROJECT_DIR=$(find . -type f -name "settings.gradle.kts" -print -quit | xargs dirname)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Project Android Gradle tidak ditemukan."
            echo "Isi ZIP di atas adalah isi sebenarnya yang perlu kita periksa."
            exit 1
          fi

          echo "Project ditemukan: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AffiliateVideoStudio-debug
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
