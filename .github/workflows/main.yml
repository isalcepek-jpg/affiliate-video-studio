name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q AffiliateVideoStudio-v1.zip
          ls -la
          ls -la AffiliateVideoStudioAndroid

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: AffiliateVideoStudioAndroid
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AffiliateVideoStudio-debug
          path: AffiliateVideoStudioAndroid/app/build/outputs/apk/debug/app-debug.apk
