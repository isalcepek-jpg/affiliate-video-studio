name: Build Affiliate Video Studio APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project files
        run: |
          echo "===== FILES IN REPOSITORY ====="
          find . -maxdepth 5 -type f | sort

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find web app
        run: |
          if [ -f "AffiliateVideoStudio/index.html" ]; then
            echo "Web app ditemukan."
          else
            echo "Mencari index.html..."
            INDEX=$(find . -type f -name "index.html" -not -path "./.git/*" | head -1)

            if [ -z "$INDEX" ]; then
              echo "ERROR: index.html tidak ditemukan."
              exit 1
            fi

            echo "index.html ditemukan di: $INDEX"
            DIR=$(dirname "$INDEX")
            echo "WEB_DIR=$DIR" >> "$GITHUB_ENV"
          fi

      - name: Set default web directory
        run: |
          if [ -z "${WEB_DIR:-}" ]; then
            echo "WEB_DIR=AffiliateVideoStudio" >> "$GITHUB_ENV"
          fi

      - name: Create Capacitor project
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

          cat > capacitor.config.json <<EOF
          {
            "appId": "com.isalcepek.affiliatevideostudio",
            "appName": "Affiliate Video Studio",
            "webDir": "${WEB_DIR}"
          }
          EOF

          cat capacitor.config.json

      - name: Add Android
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AffiliateVideoStudio-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
