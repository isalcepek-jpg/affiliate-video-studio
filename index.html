<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1976ff">
<title>Affiliate Video Studio Isal</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f3f7ff;
  font-family:Arial,sans-serif;
  color:#10213b
}

.app{
  max-width:520px;
  min-height:100vh;
  margin:auto;
  background:#fff;
  padding-bottom:78px
}

header{
  background:linear-gradient(135deg,#0867ff,#56a8ff);
  color:white;
  padding:24px 18px;
  border-radius:0 0 24px 24px
}

header h1{
  font-size:21px;
  margin:0 0 6px
}

header p{
  margin:0;
  font-size:13px;
  opacity:.9
}

main{padding:15px}

.page{display:none}
.page.active{display:block}

.card{
  border:1px solid #e3eaf5;
  border-radius:18px;
  padding:15px;
  margin-bottom:13px;
  box-shadow:0 6px 20px #154ca20b
}

h2{
  font-size:18px;
  margin:2px 0 13px
}

label{
  font-size:13px;
  font-weight:bold;
  display:block;
  margin-bottom:8px
}

.drop{
  display:block;
  text-align:center;
  border:2px dashed #b9c9e7;
  border-radius:15px;
  padding:23px;
  background:#f8fbff;
  cursor:pointer
}

.drop small{
  display:block;
  color:#72819a;
  margin-top:5px
}

input[type=file]{display:none}

#preview{
  display:none;
  width:100%;
  border-radius:13px;
  margin-top:12px;
  max-height:320px;
  object-fit:contain
}

.row{
  display:flex;
  gap:7px;
  flex-wrap:wrap
}

.chip{
  border:1px solid #d6e1f1;
  background:#fff;
  padding:9px 12px;
  border-radius:999px;
  font-size:12px
}

.chip.active{
  background:#1976ff;
  color:#fff;
  border-color:#1976ff
}

textarea{
  width:100%;
  min-height:80px;
  border:1px solid #d6e1f1;
  border-radius:12px;
  padding:11px;
  font:inherit;
  resize:vertical
}

.primary{
  width:100%;
  border:0;
  border-radius:13px;
  background:#1976ff;
  color:white;
  padding:14px;
  font-weight:bold;
  font-size:15px
}

.primary:disabled{opacity:.5}

.status{
  font-size:12px;
  color:#66758b;
  margin-top:10px;
  line-height:1.5;
  word-break:break-word
}

video{
  width:100%;
  border-radius:14px;
  background:#000
}

.nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(520px,100%);
  height:72px;
  background:white;
  border-top:1px solid #e5eaf2;
  display:flex;
  z-index:5
}

.nav button{
  flex:1;
  border:0;
  background:none;
  color:#738096;
  font-size:11px
}

.nav button span{
  display:block;
  font-size:21px;
  margin-bottom:3px
}

.nav button.active{
  color:#1976ff;
  font-weight:bold
}

.item{
  display:flex;
  gap:10px;
  padding:10px 0;
  border-bottom:1px solid #edf1f7
}

.item img{
  width:62px;
  height:80px;
  object-fit:cover;
  border-radius:8px
}

.item a{
  color:#1976ff;
  font-size:12px
}
</style>
</head>

<body>

<div class="app">

<header>
<h1>Affiliate Video Studio Isal</h1>
<p>AI video promosi dari foto produk</p>
</header>

<main>

<section class="page active" id="home">

<div class="card">
<h2>🎬 Buat Video AI</h2>

<label>Foto / screenshot produk</label>

<label class="drop" for="photo">
<b id="pick">Pilih foto produk</b>
<small>AI akan memakai foto ini sebagai referensi produk</small>
</label>

<input id="photo" type="file" accept="image/*">

<img id="preview" alt="Preview produk">
</div>

<div class="card">

<label>Voice-over / bahasa</label>

<div class="row" id="langs">

<button type="button" class="chip active" data-v="id-ID">
🇮🇩 Indonesia
</button>

<button type="button" class="chip" data-v="ms-MY">
🇲🇾 Malaysia
</button>

<button type="button" class="chip" data-v="en-US">
🇬🇧 English
</button>

</div>
</div>

<div class="card">

<label>Gaya video</label>

<div class="row" id="styles">

<button type="button" class="chip active" data-v="UGC creator">
UGC Creator
</button>

<button type="button" class="chip" data-v="cinematic commercial">
Cinematic
</button>

<button type="button" class="chip" data-v="energetic social ad">
Energetic
</button>

</div>
</div>

<div class="card">

<label>Instruksi tambahan</label>

<textarea
id="idea"
placeholder="Contoh: tonjolkan kenyamanan, cocok untuk TikTok Shop..."
></textarea>

</div>

<div class="card">

<button class="primary" id="go">
✨ Generate Video AI
</button>

<div class="status" id="status">
Belum ada video dibuat.
</div>

</div>

<div class="card" id="result" style="display:none">

<h2>✅ Video AI selesai</h2>

<video id="vid" controls playsinline></video>

<br><br>

<a
id="save"
class="chip"
download="affiliate-video.mp4"
target="_blank"
>
⬇️ Simpan MP4
</a>

</div>

</section>

<section class="page" id="history">

<div class="card">
<h2>🕘 Riwayat</h2>
<div id="hist">Belum ada video.</div>
</div>

</section>

<section class="page" id="profile">

<div class="card">

<h2>👤 Profil</h2>

<button
type="button"
class="chip"
style="width:100%"
>
G Masuk dengan Google
</button>

<p class="status">
Google Login akan diaktifkan setelah OAuth/Firebase dipasang.
</p>

</div>

</section>

</main>

<div class="nav">

<button type="button" class="active" data-p="home">
<span>⌂</span>Beranda
</button>

<button type="button" data-p="history">
<span>◷</span>Riwayat
</button>

<button type="button" data-p="profile">
<span>◎</span>Profil
</button>

</div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbxQKr2ZavSJtQZbKBRY9KhNRz-qrlKT0NO3zXo_b_zva1LsRJVIo1rRgh1QMkYg0H9AKw/exec";

let img = null;
let lang = "id-ID";
let style = "UGC creator";

const $ = id => document.getElementById(id);


/* NAVIGASI */

document.querySelectorAll(".nav button").forEach(button => {

  button.onclick = () => {

    document.querySelectorAll(".nav button")
      .forEach(x => x.classList.remove("active"));

    button.classList.add("active");

    document.querySelectorAll(".page")
      .forEach(x => x.classList.remove("active"));

    $(button.dataset.p).classList.add("active");

    if(button.dataset.p === "history"){
      loadHistory();
    }

  };

});


/* BAHASA */

document.querySelectorAll("#langs .chip").forEach(button => {

  button.onclick = () => {

    document.querySelectorAll("#langs .chip")
      .forEach(x => x.classList.remove("active"));

    button.classList.add("active");

    lang = button.dataset.v;

  };

});


/* GAYA */

document.querySelectorAll("#styles .chip").forEach(button => {

  button.onclick = () => {

    document.querySelectorAll("#styles .chip")
      .forEach(x => x.classList.remove("active"));

    button.classList.add("active");

    style = button.dataset.v;

  };

});


/* FOTO */

function fileToBase64(file){

  return new Promise((resolve,reject) => {

    const reader = new FileReader();

    reader.onload = () => resolve(reader.result);

    reader.onerror = () =>
      reject(new Error("Foto gagal dibaca."));

    reader.readAsDataURL(file);

  });

}


$("photo").addEventListener("change", async event => {

  const file = event.target.files[0];

  if(!file) return;

  try{

    $("status").textContent =
      "⏳ Menyiapkan foto...";

    img = await fileToBase64(file);

    $("preview").src = img;
    $("preview").style.display = "block";

    $("pick").textContent = file.name;

    $("status").textContent =
      "✅ Foto siap digunakan.";

  }catch(error){

    img = null;

    $("status").textContent =
      "❌ " + error.message;

  }

});


/* KOMUNIKASI SERVER */

async function sendRequest(body){

  $("status").textContent =
    "⏳ Menghubungkan ke server...";

  try{

    const capacitor =
      window.Capacitor;

    const http =
      capacitor &&
      capacitor.Plugins &&
      capacitor.Plugins.CapacitorHttp;


    if(!http){

      throw new Error(
        "CapacitorHttp tidak tersedia di APK."
      );

    }


    const response =
      await http.post({

        url:API_URL,

        headers:{
          "Content-Type":"application/json",
          "Accept":"application/json"
        },

        data:body

      });


    console.log(
      "HTTP STATUS:",
      response.status
    );

    console.log(
      "SERVER RESPONSE:",
      response.data
    );


    let data =
      response.data;


    if(typeof data === "string"){

      try{

        data =
          JSON.parse(data);

      }catch(error){

        throw new Error(
          "Respons server bukan JSON: " +
          data.substring(0,300)
        );

      }

    }


    if(!data || !data.ok){

      throw new Error(
        (data && data.error) ||
        (data && data.message) ||
        "Server gagal."
      );

    }


    return data;


  }catch(error){

    console.error(
      "API ERROR:",
      error
    );


    throw new Error(
      error.message ||
      "Tidak dapat terhubung ke server."
    );

  }

}


/* DELAY */

function wait(ms){

  return new Promise(resolve =>
    setTimeout(resolve,ms)
  );

}


/* CEK VIDEO */

async function waitForVideo(operation){

  const maxAttempts = 60;

  for(
    let attempt = 1;
    attempt <= maxAttempts;
    attempt++
  ){

    $("status").textContent =
      "⏳ AI sedang membuat video... " +
      attempt +
      "/60";


    const result =
      await sendRequest({

        action:"status",

        operation:operation

      });


    if(
      result.done &&
      result.videoUrl
    ){

      return result.videoUrl;

    }


    if(
      result.done &&
      !result.videoUrl
    ){

      throw new Error(
        "Video selesai tetapi URL video tidak tersedia."
      );

    }


    await wait(10000);

  }


  throw new Error(
    "Pembuatan video terlalu lama. Silakan coba lagi."
  );

}


/* GENERATE */

$("go").onclick = async () => {

  if(!img){

    $("status").textContent =
      "❌ Pilih foto produk dulu.";

    return;

  }


  $("go").disabled = true;

  $("result").style.display =
    "none";


  try{

    $("status").textContent =
      "⏳ Mengirim foto produk...";


    const result =
      await sendRequest({

        action:"generate",

        image:img,

        language:lang,

        style:style,

        idea:$("idea").value

      });


    if(!result.operation){

      throw new Error(
        "Server tidak memberikan ID proses video."
      );

    }


    const videoUrl =
      await waitForVideo(
        result.operation
      );


    $("vid").src =
      videoUrl;

    $("save").href =
      videoUrl;

    $("result").style.display =
      "block";

    $("status").textContent =
      "✅ Video berhasil dibuat.";


    saveHistory({

      image:img,

      url:videoUrl,

      date:new Date()
        .toLocaleString("id-ID")

    });


  }catch(error){

    $("status").textContent =
      "❌ " +
      error.message;

  }


  $("go").disabled =
    false;

};


/* RIWAYAT */

function saveHistory(item){

  let history = [];

  try{

    history =
      JSON.parse(
        localStorage.getItem(
          "avsHistory"
        ) || "[]"
      );

  }catch(error){

    history = [];

  }


  history.unshift(item);

  localStorage.setItem(
    "avsHistory",
    JSON.stringify(
      history.slice(0,20)
    )
  );

}


function loadHistory(){

  let history = [];

  try{

    history =
      JSON.parse(
        localStorage.getItem(
          "avsHistory"
        ) || "[]"
      );

  }catch(error){

    history = [];

  }


  if(!history.length){

    $("hist").innerHTML =
      "Belum ada video.";

    return;

  }


  $("hist").innerHTML =
    history.map(
      (item,index) => {

        return `

          <div class="item">

            <img
              src="${item.image}"
              alt="Produk"
            >

            <div>

              <b>
                Video ${history.length-index}
              </b>

              <div class="status">
                ${item.date}
              </div>

              <a
                href="${item.url}"
                target="_blank"
              >
                Buka video
              </a>

            </div>

          </div>

        `;

      }
    ).join("");

}

</script>

</body>
</html>
