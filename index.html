video{width:100%;border-radius:14px;background:#000}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:72px;background:white;border-top:1px solid #e5eaf2;display:flex;z-index:5}
.nav button{flex:1;border:0;background:none;color:#738096;font-size:11px}
.nav button span{display:block;font-size:21px;margin-bottom:3px}
.nav button.active{color:#1976ff;font-weight:bold}
.item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #edf1f7}
.item img{width:62px;height:80px;object-fit:cover;border-radius:8px}
.item a{color:#1976ff;font-size:12px}
</style>
</head>
